services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alwayshealthy
      POSTGRES_PASSWORD: alwayshealthy
      POSTGRES_DB: alwayshealthy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alwayshealthy -d alwayshealthy"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 只有切换到 EMBEDDING_BACKEND=bge 时才需要，默认演示走本地关键词检索
  chroma:
    image: chromadb/chroma:0.5.23
    profiles: ["vector"]
    volumes:
      - chromadata:/chroma/chroma
    ports:
      - "127.0.0.1:8001:8000"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://alwayshealthy:alwayshealthy@postgres:5432/alwayshealthy
      CHECKPOINTER: postgres
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-demo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-keyword}
      KNOWLEDGE_DIR: /srv/knowledge
      STORAGE_DIR: /srv/storage
      EMERGENCY_PHONE: ${EMERGENCY_PHONE:-120}
    volumes:
      - ../knowledge:/srv/knowledge:ro
      - ../storage:/srv/storage
      - modelcache:/srv/model_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  chromadata:
  modelcache:
